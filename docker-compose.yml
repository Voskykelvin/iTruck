services:
  app:
    build: .
    env_file: .env
    ports: ['5000:5000']
    depends_on: [mongo, redis]
  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  nginx:
    image: nginx:alpine
    ports: ['80:80']
    depends_on: [app]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
volumes:
  mongo-data:
