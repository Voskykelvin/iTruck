services:
  - type: web
    name: itruck-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm ci --prefix backend && npm ci --include=dev --prefix workspace && npm run app:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LIVE_MODE
        value: 'true'
      - key: DEMO_MODE
        value: 'false'
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: ACCESS_COOKIE_NAME
        value: itruck_access
      - key: REFRESH_COOKIE_NAME
        value: itruck_refresh
      - key: CSRF_COOKIE_NAME
        value: itruck_csrf
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DELIVERY_OTP_PEPPER
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: GOOGLE_MAPS_MAP_ID
        sync: false
      - key: SMS_PROVIDER
        value: africastalking
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: EMAIL_PROVIDER_MODULE
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: NOTIFICATION_WORKER_INTERVAL_MS
        value: '15000'
      - key: NOTIFICATION_WORKER_BATCH_SIZE
        value: '20'
      - key: OPERATIONS_SCAN_INTERVAL_MS
        value: '900000'
      - key: TRACKING_STALE_MINUTES
        value: '45'
      - key: EMAIL_TIMEOUT_MS
        value: '15000'
      - key: SMS_TIMEOUT_MS
        value: '15000'
      - key: CASE_SLA_FIRST_RESPONSE_MINUTES_LOW
        value: '480'
      - key: CASE_SLA_FIRST_RESPONSE_MINUTES_NORMAL
        value: '240'
      - key: CASE_SLA_FIRST_RESPONSE_MINUTES_HIGH
        value: '60'
      - key: CASE_SLA_FIRST_RESPONSE_MINUTES_URGENT
        value: '30'
      - key: CASE_SLA_RESOLUTION_MINUTES_LOW
        value: '7200'
      - key: CASE_SLA_RESOLUTION_MINUTES_NORMAL
        value: '4320'
      - key: CASE_SLA_RESOLUTION_MINUTES_HIGH
        value: '1440'
      - key: CASE_SLA_RESOLUTION_MINUTES_URGENT
        value: '480'
      - key: CASE_REOPEN_DAYS
        value: '14'
      - key: CASE_AUTO_CLOSE_DAYS
        value: '7'
