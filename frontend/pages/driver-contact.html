<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8FAFC">
  <title>iTruck - Driver Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/tracking.css">
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <a class="brand" href="../index.html"><span class="brand-mark">iT</span> iTruck</a>
      <nav>
        <a href="dashboard-client.html">Client Dashboard</a>
        <a href="dashboard-owner.html">Owner Dashboard</a>
        <a href="book-truck.html">Book Truck</a>
        <a class="active" href="tracking.html">Tracking</a>
        <a href="listings.html">Browse Trucks</a>
        <a href="profile.html">Profile</a>
      </nav>
    </aside>
    <main class="main-panel contact-workspace">
      <div class="topbar">
        <div>
          <p class="eyebrow">Driver Contact</p>
          <h1 id="contactTitle">Contact Driver</h1>
        </div>
        <div class="quick-actions">
          <a class="ghost-btn" id="backToTracking" href="tracking.html">Back to Tracking</a>
          <span class="badge success">Dispatch monitored</span>
        </div>
      </div>

      <section class="driver-contact-layout">
        <section class="panel driver-profile-panel" id="driverProfile"></section>
        <section class="panel contact-method-panel">
          <div class="panel-heading">
            <div><p class="eyebrow">Available Channels</p><h2>Contact Options</h2></div>
          </div>
          <div id="contactMethods" class="contact-method-grid"></div>
        </section>
        <section class="panel driver-chat-panel">
          <div class="panel-heading">
            <div><p class="eyebrow">Shipment Thread</p><h2>Message Driver</h2></div>
          </div>
          <div id="chatHistory" class="chat-history"></div>
          <form id="driverChatForm" class="driver-chat-form">
            <label>Message<textarea name="message" required placeholder="Ask for ETA, pickup confirmation, document status, or delivery update"></textarea></label>
            <button class="primary-btn" type="submit">Send Message</button>
          </form>
        </section>
      </section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/notifications-ui.js"></script>
  <script src="../js/tracking-data.js"></script>
  <script src="../js/driver-contact.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
