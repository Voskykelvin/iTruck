<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8FAFC">
  <title>iTruck - Live Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/tracking.css">
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <a class="brand" href="../index.html"><span class="brand-mark">iT</span> iTruck</a>
      <nav>
        <a href="dashboard-client.html">Client Dashboard</a>
        <a href="dashboard-owner.html">Owner Dashboard</a>
        <a href="book-truck.html">Book Truck</a>
        <a class="active" href="tracking.html">Tracking</a>
        <a href="listings.html">Browse Trucks</a>
        <a href="profile.html">Profile</a>
      </nav>
    </aside>
    <main class="main-panel tracking-workspace">
      <div class="topbar">
        <div><p class="eyebrow">Live Tracking</p><h1>Shipment Map</h1></div>
        <div class="quick-actions">
          <button class="ghost-btn" id="shareTracking">Share Link</button>
          <span class="badge success">LIVE</span>
        </div>
      </div>

      <section class="tracking-layout">
        <aside class="panel tracking-sidebar">
          <div class="panel-heading">
            <div><p class="eyebrow">Shipments</p><h2>Active Routes</h2></div>
          </div>
          <div id="trackingList" class="tracking-list"></div>
        </aside>

        <section class="map-shell">
          <div class="map-toolbar">
            <div>
              <span class="badge success">On schedule</span>
              <strong id="mapRouteTitle">Nairobi to Kampala</strong>
            </div>
            <div class="quick-actions">
              <button class="ghost-btn" id="mapRoad">Road</button>
              <button class="ghost-btn" id="mapSatellite">Satellite</button>
            </div>
          </div>
          <iframe id="googleMap" class="google-map" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="iTruck route map"></iframe>
          <div class="map-status-card">
            <span>Current position</span>
            <strong id="currentPosition">Near Nakuru</strong>
            <small id="routeTelemetry">72 km/h - ETA 8h 20m</small>
          </div>
        </section>

        <aside class="panel tracking-detail-panel">
          <p class="eyebrow">Shipment Detail</p>
          <div id="trackingDetail"></div>
          <div class="progress"><span id="routeProgress" style="width:64%"></span></div>
          <div class="tracking-actions">
            <button class="primary-btn" id="confirmDelivery">Confirm Delivery</button>
            <button class="secondary-btn" id="messageDriver">Contact Driver</button>
            <button class="ghost-btn" id="reportIssue">Report Issue</button>
          </div>
        </aside>
      </section>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/notifications-ui.js"></script>
  <script src="../js/tracking-data.js"></script>
  <script src="../js/tracking.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
