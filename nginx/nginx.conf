events {}
http {
  gzip on;
  server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/ { proxy_pass http://app:5000; }
    location /socket.io/ { proxy_pass http://app:5000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
